worker_processes  1;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # every writable path lives in /tmp so the container can run read-only
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log        /dev/stdout combined buffer=8k flush=5s;
    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 30;
    server_tokens     off;
    charset           utf-8;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # nginx only inherits add_header when the child level declares none of its
    # own, so the cache policy is a variable instead of a second header block
    map $sent_http_content_type $cache_policy {
        default        "public, max-age=2592000, immutable";
        ~*text/html    "no-cache";
    }

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # TLS and redirects are the reverse proxy's job
        add_header Cache-Control           $cache_policy          always;
        add_header X-Content-Type-Options  nosniff                always;
        add_header X-Frame-Options         SAMEORIGIN             always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;

        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
